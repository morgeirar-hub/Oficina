<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torre de Oficinas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --ui:#1b1f31; --ui2:#2a3048; --ui3:#363d5c; --line:#0c0e1b;
  --text:#f3eedf; --muted:#a3a2b6; --acc:#ffd84a; --ok:#5ad1a0; --walk:#f0b13b; --idle:#6aa8ff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1030;color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas#c{display:block;position:fixed;inset:0;width:100vw;height:100vh;touch-action:manipulation}
.px{font-family:'Press Start 2P',ui-monospace,monospace;letter-spacing:.02em}
.btn{background:var(--ui2);color:var(--text);border:2px solid var(--line);padding:8px 11px;font:12px/1 'Press Start 2P',ui-monospace,monospace;cursor:pointer;border-radius:0;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.10)}
.btn:hover{background:var(--ui3)}
.btn:active{box-shadow:inset 3px 3px 0 rgba(0,0,0,.4)}
.btn:disabled{opacity:.45;cursor:not-allowed}

#hud{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:8px;padding:0 12px;z-index:3;
  background:rgba(16,19,34,.88);border-bottom:3px solid var(--line);backdrop-filter:blur(3px)}
#hud h1{margin:0;flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clock{font-size:11px;color:var(--acc);min-width:52px;text-align:right}

#hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:2;pointer-events:none;
  background:rgba(16,19,34,.85);border:2px solid var(--line);padding:9px 12px;font-size:9px;white-space:nowrap;transition:opacity .3s}
#hint.hide{opacity:0}

#panel{position:fixed;top:52px;right:0;bottom:0;width:380px;z-index:3;background:var(--ui);border-left:3px solid var(--line);
  transform:translateX(105%);transition:transform .35s ease;overflow:auto;padding:14px}
#panel.open{transform:none}
.ptop{display:flex;align-items:center;gap:8px}
.ptop .btn{padding:8px}
.ptitle{flex:1;min-width:0}
.ptitle input{width:100%;background:var(--line);color:var(--acc);border:2px solid var(--ui3);padding:8px;font:11px 'Press Start 2P',ui-monospace,monospace}
#osub{color:var(--muted);font-size:12px;margin-top:6px}
.sec{font-size:9px;color:var(--muted);margin:18px 0 8px}
.card{display:flex;gap:12px;background:var(--ui2);border:2px solid var(--line);padding:10px;margin-bottom:10px;transition:background .3s}
.card.flash{background:#4a4220}
.card canvas{width:48px;height:66px;image-rendering:pixelated;background:var(--line);border:2px solid var(--ui3);flex:none}
.card .info{flex:1;min-width:0}
.card input{width:100%;background:transparent;color:var(--text);border:0;border-bottom:2px dashed var(--ui3);padding:2px 0 4px;font:600 15px system-ui,sans-serif}
.card input:focus{outline:none;border-bottom-color:var(--acc)}
.st{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;flex:none;background:var(--ok)}
.agent{font-size:12px;margin-top:8px;padding:6px 8px;background:var(--line);color:var(--muted);border-left:3px solid var(--ui3)}
.note{font-size:12.5px;color:var(--muted);background:var(--ui2);border:2px solid var(--line);padding:10px}
#back{width:100%;margin-top:8px}
.log{font-size:12.5px;color:var(--muted);background:var(--ui2);border:2px solid var(--line);padding:10px;margin-top:10px}
.log b{color:var(--text);display:block;margin-bottom:6px;font-size:12px}
.log div{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-top:1px dashed var(--ui3)}

/* ---------- fichaje ---------- */
#gate{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 28%,#2b3050 0%,#12152a 60%,#0a0c18 100%)}
#gate.clear{background:transparent;pointer-events:none}
#gate.clear .gwrap{visibility:hidden}
#gate.hidden{display:none}
.gwrap{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(430px,92vw);max-height:100vh;overflow:auto;padding:16px 2px}
#gateCv{width:100%;aspect-ratio:120/68;image-rendering:pixelated;border:3px solid var(--line);box-shadow:0 0 0 3px #2a3048,0 12px 40px rgba(0,0,0,.5)}
.gcard{width:100%;background:var(--ui);border:3px solid var(--line);padding:16px;box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.06)}
.gtitle{font-size:12px;color:var(--acc);text-align:center}
#gSub{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.gcard label{display:block;font-size:9px;color:var(--muted);margin:14px 0 6px}
.gfield{display:flex}
.gcard input{flex:1;min-width:0;background:var(--line);color:var(--text);border:2px solid var(--ui3);padding:10px;font:15px system-ui,sans-serif;border-radius:0}
.gcard input:focus{outline:none;border-color:var(--acc)}
.eye{background:var(--ui2);border:2px solid var(--ui3);border-left:0;color:var(--text);padding:0 10px;cursor:pointer;font-size:15px}
#gCaps{font-size:12px;color:var(--walk);margin-top:6px;display:none}
#gMsg{min-height:20px;font-size:13px;margin-top:12px;color:#ff8a7a;text-align:center}
#gMsg.ok{color:var(--ok)}
#gBtn{width:100%;margin-top:10px;padding:13px;background:#2f6f4f}
#gBtn:hover{background:#38845e}
.link{display:block;margin:12px auto 0;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px}
.door{position:fixed;top:0;bottom:0;width:50.5%;z-index:21;pointer-events:none;transition:transform .6s steps(12);
  background:repeating-linear-gradient(90deg,#9aa3b5 0 8px,#a9b1c2 8px 16px)}
.door.l{left:0;transform:translateX(-101%);border-right:4px solid #5d6577}
.door.r{right:0;transform:translateX(101%);border-left:4px solid #5d6577}
.doors-closed .door{transform:none}

/* ---------- avisos, paneles y ventanas ---------- */
#alerts{display:flex;gap:6px}
.alert{font-size:11px;padding:7px 9px}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{0%{background:#c0392b;color:#fff}50%{background:#f5c518;color:#1b1f31}}
.blinkred{animation:blinkr 1s steps(1) infinite}
@keyframes blinkr{0%{background:#a3271c}50%{background:var(--ui2)}}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--ui2);border:2px solid var(--line);padding:10px;text-align:left;color:var(--text);font:inherit;cursor:pointer}
button.tile:hover{background:var(--ui3)}
.tile small{color:var(--muted);font-size:12px;display:block}
.tile b{display:block;font:13px 'Press Start 2P',ui-monospace,monospace;margin-top:8px;color:var(--acc);word-break:break-all}
.mail{background:var(--ui2);border:2px solid var(--line);padding:9px 10px;margin-bottom:8px}
.mail.unread{border-left:4px solid var(--acc)}
.mail.ask{border-left:4px solid #e2574c}
.mh{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.mh span{color:var(--muted);font-size:11.5px;white-space:nowrap}
.ms{font-size:13.5px;margin-top:3px;font-weight:600}
.mb{font-size:12.5px;color:var(--muted);margin-top:4px;white-space:pre-wrap;max-height:3.1em;overflow:hidden;cursor:pointer}
.mb.open{max-height:none}
.mm{font-size:11.5px;color:var(--muted);margin-top:6px;font-style:italic}
.ma{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rem{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:8px;cursor:pointer}
.sbtn{background:var(--ui3);color:var(--text);border:2px solid var(--line);padding:6px 9px;font:12.5px system-ui,sans-serif;cursor:pointer;border-radius:0}
.sbtn:hover{background:#454d72}
.sbtn.pri{background:#2f6f4f}
.sbtn.pri:hover{background:#38845e}
.form label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.form input,.form select,.form textarea{width:100%;background:var(--line);color:var(--text);border:2px solid var(--ui3);padding:8px;font:14px system-ui,sans-serif;border-radius:0}
.form input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:var(--acc)}
.form textarea{resize:vertical;min-height:58px}
.row{display:flex;gap:8px;margin-top:10px}
.row>*{flex:1;min-width:0}
.empty{color:var(--muted);font-size:12.5px;padding:6px 0}
.saldo{background:var(--line);border:2px solid var(--ui3);padding:14px;text-align:center;margin-top:10px}
.saldo small{display:block;color:var(--muted);font-size:9px;margin-bottom:10px}
.saldo b{font:17px 'Press Start 2P',ui-monospace,monospace;color:var(--ok)}
.saldo b.neg,.neg{color:#ff8a7a}
.pos{color:var(--ok)}
.mov{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:7px 0;border-top:1px dashed var(--ui3)}
.mov .c{color:var(--muted);font-size:11.5px}
.mov b{white-space:nowrap}
.seg{display:flex}
.seg .sbtn{flex:1}
.kcal{margin-top:12px;font:12px 'Press Start 2P',ui-monospace,monospace;color:var(--walk);text-align:center}
.wchart{width:100%;margin-top:8px;border:2px solid var(--line);display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
#modal{position:fixed;inset:0;z-index:15;background:rgba(5,7,15,.62);display:none;align-items:center;justify-content:center;padding:16px}
#modal.open{display:flex}
#modal.low{align-items:flex-end;background:rgba(5,7,15,.25)}
#modal.low .mcard{max-height:48vh}
.mcard{background:var(--ui);border:3px solid var(--line);width:min(520px,100%);max-height:90vh;overflow:auto;padding:16px;box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),0 20px 60px rgba(0,0,0,.5)}
.mtitle{font-size:11px;color:var(--acc);display:flex;align-items:center;gap:10px;line-height:1.6;position:sticky;top:-16px;margin:-16px -16px 0;padding:12px 16px;background:var(--ui);border-bottom:2px solid var(--line);z-index:2}
.mtitle canvas{width:32px;height:44px;image-rendering:pixelated;background:var(--line);border:2px solid var(--ui3)}
.mtitle .x{margin-left:auto}
.chat{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.bub{max-width:88%;padding:9px 11px;border:2px solid var(--line);font-size:14px}
.bub.b{background:var(--ui2);align-self:flex-start}
.bub.u{background:#2f6f4f;align-self:flex-end}
.rep{display:grid;grid-template-columns:105px 1fr 88px;gap:8px;align-items:center;font-size:12.5px;margin:6px 0}
.rep .bar{height:10px;background:var(--acc)}
.rep span:last-child{text-align:right}
details.fold>summary{cursor:pointer;font:9px 'Press Start 2P',ui-monospace,monospace;color:var(--muted);margin:18px 0 8px;list-style:none}
details.fold>summary::before{content:'▸ '}
details.fold[open]>summary::before{content:'▾ '}
.acc{background:var(--ui2);border:2px solid var(--line);padding:10px;margin-bottom:8px}
.acc .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.acc .top b{font:12px 'Press Start 2P',ui-monospace,monospace;color:var(--acc)}
.acc .big{font:15px 'Press Start 2P',ui-monospace,monospace;margin-top:10px}
.acc .c{color:var(--muted);font-size:11.5px;margin-top:6px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 0;border-top:1px dashed var(--ui3)}
.kv.tot{font-weight:700;border-top:2px solid var(--ui3)}
.banner{background:#4a3a10;border:2px solid var(--acc);padding:10px;margin-top:12px;font-size:13px}
.banner .sbtn{margin-top:8px;width:100%}
.news-item{border-top:1px dashed var(--ui3);padding:10px 0}
.news-item a{color:#8cc4ff}
.tag{display:inline-block;font-size:11px;padding:1px 6px;margin-right:4px;border:1px solid var(--ui3);background:var(--line)}
.tag.pos{border-color:#2f6f4f}.tag.neg{border-color:#a3271c}
table.inv{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
table.inv td{padding:4px 2px;border-top:1px dashed var(--ui3)}
table.inv td.n{text-align:right;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.cal .h{font-size:10.5px;color:var(--muted);text-align:center;padding:2px 0}
.cal button{background:var(--ui2);border:2px solid var(--line);color:var(--text);min-height:42px;padding:3px 2px;font:12px system-ui,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.cal button.out{opacity:.35}
.cal button.today{border-color:var(--acc)}
.cal button.selected{background:var(--ui3)}
.cal .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.cal .dots i{width:6px;height:6px;display:block}
.calnav{display:flex;align-items:center;gap:8px;margin-top:10px}
.calnav b{flex:1;text-align:center;font-size:13px}
.ev{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:6px 0;border-top:1px dashed var(--ui3)}
.ev i{width:8px;height:8px;margin-top:5px;flex:none;display:block}
.ev .c{color:var(--muted);font-size:11.5px}
.day{font:9px 'Press Start 2P',ui-monospace,monospace;color:var(--acc);margin:12px 0 2px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend span{display:flex;align-items:center;gap:4px}.legend i{width:8px;height:8px;display:block}
.meter{position:relative;height:16px;background:var(--line);border:2px solid var(--ui3);margin:8px 0 4px}
.meter .z{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--muted)}
.meter .f{position:absolute;top:0;bottom:0}
.meter-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0;cursor:pointer}
.chk input{width:auto}
#btnNube.ok{box-shadow:inset 0 -4px 0 #3fd17a}
#btnNube.sync{box-shadow:inset 0 -4px 0 #f0b13b}
#btnNube.err{box-shadow:inset 0 -4px 0 #ff5b4d}
#gNube .form{margin-top:4px}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(16px);opacity:0;z-index:16;background:var(--ui);border:3px solid var(--line);padding:10px 14px;font-size:13.5px;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:760px){
  #panel{top:auto;left:0;width:auto;height:46vh;border-left:0;border-top:3px solid var(--line);transform:translateY(105%)}
  #panel.open{transform:none}
  #hud h1{font-size:9px}
  #hint{font-size:7px;bottom:10px}
  .btn{font-size:10px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <h1 class="px" id="title">TORRE</h1>
  <div id="alerts"></div>
  <span class="px" id="clock">--:--</span>
  <button class="btn" id="btnNube" title="Nube">☁️</button>
  <button class="btn" id="btnTime" title="Hora del día">🕒</button>
  <button class="btn" id="btnHome" title="Ver toda la torre">🏢</button>
  <button class="btn" id="btnOut" title="Fichar salida">🚪</button>
</div>

<div id="gate">
  <div class="gwrap">
    <canvas id="gateCv" width="120" height="68"></canvas>
    <form class="gcard" id="gateForm" autocomplete="on">
      <button type="button" class="sbtn" id="gNubeBtn" style="width:100%;margin-bottom:14px">☁️ Conectar a la nube</button>
      <div class="gtitle px" id="gTitle">CONTROL DE ACCESO</div>
      <div id="gSub"></div>
      <label class="px" for="gUser" id="gUserL">USUARIO</label>
      <div class="gfield"><input id="gUser" autocomplete="username" maxlength="32" spellcheck="false"></div>
      <label class="px" for="gPass">CONTRASEÑA</label>
      <div class="gfield"><input id="gPass" type="password" maxlength="64"><button type="button" class="eye" data-for="gPass" title="Mostrar u ocultar">👁</button></div>
      <div id="gRepWrap">
        <label class="px" for="gRep">REPITE LA CONTRASEÑA</label>
        <div class="gfield"><input id="gRep" type="password" maxlength="64" autocomplete="new-password"></div>
      </div>
      <div id="gCaps">⇪ Bloq Mayús está activado</div>
      <div id="gMsg"></div>
      <button class="btn" id="gBtn" type="submit">FICHAR ENTRADA</button>
      <button type="button" class="link" id="gForgot">¿Has olvidado la contraseña?</button>
      <button type="button" class="link" id="gSwitch" style="display:none"></button>
      <details class="fold" id="gNube"><summary>☁️ NUBE</summary><div class="form">
        <div class="mm" id="gNubeEst" style="font-style:normal"></div>
        <label>URL del proyecto de Supabase</label><input id="gNU" placeholder="https://xxxx.supabase.co" spellcheck="false">
        <label>Clave pública (anon / publishable)</label><input id="gNK" placeholder="eyJ… o sb_publishable_…" spellcheck="false">
        <div class="row"><button type="button" class="sbtn pri" id="gNS">Guardar</button><button type="button" class="sbtn" id="gNX">Usar sin nube</button></div>
      </div></details>
    </form>
  </div>
</div>
<div class="door l"></div><div class="door r"></div>

<div id="hint" class="px">Haz clic en una oficina para entrar</div>

<aside id="panel">
  <div class="ptop">
    <button class="btn" id="prev" title="Oficina anterior">◀</button>
    <div class="ptitle"><input id="oname" maxlength="26" aria-label="Nombre de la oficina"><div id="osub"></div></div>
    <button class="btn" id="next" title="Oficina siguiente">▶</button>
  </div>
  <div id="pbody"></div>
  <button class="btn" id="back">← VOLVER A LA TORRE</button>
</aside>

<div id="modal"><div class="mcard" id="mcard"></div></div>
<div id="toast"></div>

<script>
/* =====================================================
   MUNDO
   ===================================================== */
const WX0 = -200, W = 1300, H = 460;   // el búfer cubre x = -200 … 1100
const GY = 400, FH = 52;               // nivel de calle y alto de planta
const TOP = GY - FH * 5;               // techo de la torre (y = 140)
const SHAFT = 562;                     // hueco del ascensor 562…594

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const g = buf.getContext('2d');

/* ---------- guardado ---------- */
const SAVE = 'torre-oficinas-v1';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(SAVE)) || {}; } catch (e) {}
saved.offices = saved.offices || {}; saved.workers = saved.workers || {};
saved.tower = saved.tower || 'Torre de Manuel';
saved.time = saved.time || 'auto';
function persist() { try { localStorage.setItem(SAVE, JSON.stringify(saved)); } catch (e) {} if (typeof nubeMarcar === 'function') nubeMarcar(); }

/* ---------- utilidades ---------- */
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.random() * arr.length | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function hex(c) { c = c.slice(1); if (c.length === 3) c = [...c].map(x => x + x).join(''); const n = parseInt(c, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const rgb = a => `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})`;
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const shadeCache = new Map();
function shade(c, f) { const k = c + f; let v = shadeCache.get(k); if (!v) { const a = hex(c); v = rgb([a[0] * f, a[1] * f, a[2] * f]); shadeCache.set(k, v); } return v; }
let NIGHT = 0, NQ = 0;
const nCache = new Map();
function N(c) { // tiñe de noche los colores del exterior
  if (NQ === 0) return c;
  const k = c + '|' + NQ; let v = nCache.get(k);
  if (!v) { const a = hex(c), n = NQ / 20; v = rgb([a[0] * (1 - .66 * n), a[1] * (1 - .62 * n), a[2] * (1 - .42 * n)]); nCache.set(k, v); }
  return v;
}
function R(x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); }

// Valores MET (gasto energético) aproximados por actividad e intensidad baja / media / alta
const MET = { 'Correr': [7, 9.8, 11.5], 'Caminar': [2.8, 3.5, 5], 'Bicicleta': [4, 6.8, 10], 'Bici estática / spinning': [4.8, 6.8, 8.8], 'Natación': [5.8, 8, 9.8],

  'Elíptica': [4.6, 5, 6], 'Remo': [4.8, 7, 8.5], 'Boxeo': [5.5, 7.8, 9.5], 'Yoga / estiramientos': [2.3, 2.5, 4], 'Otro': [3, 5, 7] };
const INTENS = ['Baja', 'Media', 'Alta'];
const MORNING = [5, 14]; // "por la mañana": de 05:00 a 13:59
const dayKey = (t = Date.now()) => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const lastWeight = () => { const ks = Object.keys(saved.gym.pesos).sort(); return ks.length ? saved.gym.pesos[ks[ks.length - 1]] : null; };
const isMorning = () => { const h = new Date().getHours(); return h >= MORNING[0] && h < MORNING[1]; };
const kcalOf = (tipo, i, min, kg) => Math.round(MET[tipo][i] * kg * min / 60);
function checkWeight() { const k = dayKey(); if (isMorning() && !saved.gym.pesos[k] && !saved.gym.skip[k]) askWeight(true); }
function askWeight(morning) {

  openModal(`<div class="mtitle px">⚖️ PESO DE HOY<button class="sbtn x" id="mClose">✕</button></div>

function weightChart(box) {
  const ks = Object.keys(saved.gym.pesos).sort().slice(-30); if (ks.length < 2) return;

  const c = cv2.getContext('2d'), vs = ks.map(k => saved.gym.pesos[k]), mn = Math.min(...vs) - .5, mx = Math.max(...vs) + .5;
  const X = i => 40 + i * (640 / (vs.length - 1)), Y = v => 160 - (v - mn) / (mx - mn) * 130;

  c.strokeStyle = '#2a3048'; c.lineWidth = 2; for (let i = 0; i < 4; i++) { const y = 30 + i * 43; c.beginPath(); c.moveTo(40, y); c.lineTo(680, y); c.stroke(); }

  c.fillStyle = '#5ad1a0'; vs.forEach((v, i) => c.fillRect(X(i) - 5, Y(v) - 5, 10, 10));

function mesData(k) {

    return z ? Date.UTC(+Y, Mo - 1, +D, +h, +mi, +se) : new Date(+Y, Mo - 1, +D, +h, +mi, +se).getTime(); };
  for (const l of lines) {

  persist(); toast(texto); notify('riesgo', texto); if (nivel === 'objetivo') sndOk(); else sndFail();

function checkRiesgo() {
  const e = estadoCuenta('ftmo'); if (!e || dayKey(e.t) !== dayKey()) return;
  const R2 = saved.risk, d = dayKey(), c = e.cambio; R2.max[d] = Math.max(R2.max[d] ?? c, c);

  if (R2.max[d] >= R2.objetivo && c < R2.objetivo) riskAlert('suelo', 'aviso', `⚠️ FTMO: has bajado de +${R2.objetivo} € (vas ${signE(c)}). Has devuelto el excedente: para por hoy.`);
  if (c <= -R2.perdida * .75) riskAlert('cerca', 'aviso', `⚠️ FTMO: llevas ${signE(c)} hoy, cerca de tu límite de −${R2.perdida} €.`);
  if (c <= -R2.perdida) riskAlert('stop', 'stop', `🛑 FTMO: límite diario de −${R2.perdida} € alcanzado (${signE(c)}). STOP por hoy.`);
  if (-c >= limD * .8) riskAlert('ftmoD', 'stop', `🚨 FTMO: estás a ${fmtE(Math.max(0, limD + c))} del límite de pérdida diaria de FTMO (${fmtE(limD)}).`);

}

// SHA-256 en JS puro (funciona también abriendo el archivo con doble clic)
const ror = (x, n) => (x >>> n) | (x << (32 - n));
const SHA_K = [], SHA_H = [];
(() => { let n = 2, c = 0; while (c < 64) { let p = true; for (let i = 2; i * i <= n; i++) if (n % i === 0) { p = false; break; }
  if (p) { if (c < 8) SHA_H[c] = (Math.pow(n, 1 / 2) % 1) * 4294967296 | 0; SHA_K[c] = (Math.pow(n, 1 / 3) % 1) * 4294967296 | 0; c++; } n++; } })();
function sha256(str) {
  const b = new TextEncoder().encode(str), l = b.length, len = ((l + 9 + 63) >> 6) << 6;
  const m = new Uint8Array(len); m.set(b); m[l] = 0x80;
  const dv = new DataView(m.buffer); dv.setUint32(len - 4, (l * 8) >>> 0); dv.setUint32(len - 8, Math.floor(l * 8 / 4294967296));
  const H = SHA_H.slice(), w = new Int32Array(64);
  for (let i = 0; i < len; i += 64) {
    for (let t = 0; t < 16; t++) w[t] = dv.getUint32(i + t * 4);
    for (let t = 16; t < 64; t++) { const x = w[t - 15], y = w[t - 2]; w[t] = (w[t - 16] + (ror(x, 7) ^ ror(x, 18) ^ (x >>> 3)) + w[t - 7] + (ror(y, 17) ^ ror(y, 19) ^ (y >>> 10))) | 0; }
    let [a, bb, c, d, e, f, gg, h] = H;
    for (let t = 0; t < 64; t++) {
      const t1 = (h + (ror(e, 6) ^ ror(e, 11) ^ ror(e, 25)) + ((e & f) ^ (~e & gg)) + SHA_K[t] + w[t]) | 0;
      const t2 = ((ror(a, 2) ^ ror(a, 13) ^ ror(a, 22)) + ((a & bb) ^ (a & c) ^ (bb & c))) | 0;
      h = gg; gg = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + bb) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0; H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + gg) | 0; H[7] = (H[7] + h) | 0;

}
const nubeLeer = () => nfetch(`/rest/v1/torre_estado?select=datos,actualizado&user_id=eq.${nube.ses.user_id}`).then(r => r && r[0] || null);
const nubeSello = () => nfetch(`/rest/v1/torre_estado?select=actualizado&user_id=eq.${nube.ses.user_id}`).then(r => r && r[0] ? Date.parse(r[0].actualizado) : 0);
function nubeEstado(st, err) {
  if (st) nube.estado = st; if (err !== undefined) nube.error = err;
  const b = document.getElementById('btnNube'); if (!b) return;
  const on = nubeCfg().url && nube.ses && nube.lista; if (!on && nube.estado !== 'err') nube.estado = 'off';
  b.className = 'btn ' + (on ? nube.estado : '');
  b.title = !nubeCfg().url ? 'Nube sin configurar (datos solo en este navegador)' : !on ? 'Nube: sin sesión' : { ok: 'Nube: todo sincronizado', sync: 'Nube: guardando…', err: 'Nube: error · ' + nube.error }[nube.estado] || 'Nube';
}
function nubeMarcar() {
  if (!nube.lista || !nube.ses) return;
  nube.dirty = true; nubeEstado('sync'); clearTimeout(nube.t); nube.t = setTimeout(nubeSubir, 1500);
}
async function nubeSubir() {
  if (!nube.lista || !nube.ses) return; clearTimeout(nube.t);
  try {
    const remoto = await nubeSello().catch(() => 0);
    if (remoto && nube.meta.lastSync && remoto > nube.meta.lastSync + 1000) toast('☁️ Había cambios de tu otro dispositivo; se ha guardado esta versión');
    const ahora = new Date().toISOString();
    await nfetch('/rest/v1/torre_estado', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ user_id: nube.ses.user_id, datos: saved, actualizado: ahora }) });
    nube.meta.lastSync = Date.parse(ahora); saveMeta(); nube.dirty = false; nubeEstado('ok', '');
  } catch (e) { nubeEstado('err', e.message); nube.t = setTimeout(nubeSubir, 15000); }
}
const NUBE_CLAVES = ['offices', 'mail', 'bank', 'gym', 'inv', 'teso', 'news', 'sec', 'personal', 'risk', 'tg', 'backup'];
async function nubeBajar(forzar) {
  if (!nube.lista || !nube.ses || (nube.dirty && !forzar) || typing() || byId('modal').classList.contains('open')) return;
  try {
    const sello = await nubeSello(); if (!sello || (!forzar && sello <= nube.meta.lastSync)) { if (nube.estado !== 'sync') nubeEstado('ok', ''); return; }
    const r = await nubeLeer(); if (!r) return; const d = r.datos;
    try { localStorage.setItem(SAVE, JSON.stringify(d)); } catch (e) {}
    nube.meta.lastSync = Date.parse(r.actualizado); saveMeta();
    if (NUBE_CLAVES.some(k => !(k in d))) { try { sessionStorage.setItem('torre-sesion', '1'); } catch (e) {} location.reload(); return; }
    Object.keys(saved).forEach(k => delete saved[k]); Object.assign(saved, d);
    setTitle(); setTimeBtn(); refreshAlerts(); if (sel) buildPanel();
    nubeEstado('ok', ''); toast('☁️ Actualizado con los cambios de tu otro dispositivo');
  } catch (e) { nubeEstado('err', e.message); }
}
setInterval(() => nubeBajar(), 15000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') nubeBajar(); });
addEventListener('beforeunload', () => { if (nube.dirty && nube.ses) { const c = nubeCfg(); try { fetch(c.url + '/rest/v1/torre_estado', { method: 'POST', keepalive: true, headers: { apikey: c.key, Authorization: 'Bearer ' + nube.ses.access_token, 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ user_id: nube.ses.user_id, datos: saved, actualizado: new Date().toISOString() }) }); } catch (e) {} } });
function nubeSalir() {
  if (!nube.ses) return;
  const ses = nube.ses, c = nubeCfg();
  nubeSubir().finally(() => { fetch(c.url + '/auth/v1/logout', { method: 'POST', headers: { apikey: c.key, Authorization: 'Bearer ' + ses.access_token } }).catch(() => {}); borrarSesion(); });
}

/* ---------- fichaje con la nube ---------- */
function ajustarGateNube() {
  const c = nubeCfg(), on = !!c.url, est = $g('gNubeEst');
  $g('gNU').value = c.url; $g('gNK').value = c.key;
  est.innerHTML = on ? '✅ Nube configurada: entras con tu correo y tus datos se sincronizan entre dispositivos.' : 'Sin nube: los datos se guardan solo en este navegador.';
  const nb = $g('gNubeBtn'); nb.textContent = on ? '☁️ Nube conectada · cambiar' : '☁️ Conectar a la nube (móvil + portátil)'; nb.classList.toggle('pri', !on);
  const sw = $g('gSwitch');
  if (!on) { $g('gUserL').textContent = 'USUARIO'; $g('gUserL').style.display = ''; gUser.parentElement.style.display = ''; gUser.type = 'text'; sw.style.display = 'none'; return; }
  $g('gUserL').textContent = 'CORREO'; gUser.type = 'email'; gUser.autocomplete = 'email';
  if (!gUser.value && saved.auth && saved.auth.email) gUser.value = saved.auth.email;
  if (G.mode === 'alta') { $g('gTitle').textContent = 'CREAR CUENTA EN LA NUBE'; $g('gSub').textContent = 'Solo la primera vez. Se subirán los datos que ya tengas en este navegador.'; gBtn.textContent = 'CREAR CUENTA Y ENTRAR'; sw.textContent = 'Ya tengo cuenta: fichar'; }
  else if (G.mode === 'nueva') { $g('gTitle').textContent = 'NUEVA CONTRASEÑA'; $g('gSub').textContent = 'Elige tu nueva contraseña.'; $g('gRepWrap').style.display = ''; gUser.parentElement.style.display = 'none'; $g('gUserL').style.display = 'none'; gBtn.textContent = 'GUARDAR CONTRASEÑA'; $g('gForgot').style.display = 'none'; sw.style.display = 'none'; return; }
  else { $g('gSub').textContent = 'Ficha con tu correo y tu contraseña de la nube.'; sw.textContent = '¿Primera vez con la nube? Crear cuenta'; }
  gUser.parentElement.style.display = ''; $g('gUserL').style.display = '';
  sw.style.display = '';
}
$g('gNubeBtn').onclick = () => { const d = $g('gNube'); d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(() => $g('gNU').focus(), 300); };
$g('gSwitch').onclick = () => { setMode(G.mode === 'alta' ? 'login' : 'alta'); msg(''); };
$g('gNS').onclick = () => { const url = $g('gNU').value.trim(), key = $g('gNK').value.trim(); if (!/^https?:\/\//.test(url) || !key) return msg('Pega la URL (https://…) y la clave pública');
  try { localStorage.setItem(NUBE_CFG, JSON.stringify({ url, key })); } catch (e) {} setMode('login'); msg('Nube guardada. Si es la primera vez, pulsa «Crear cuenta».', true); nubeEstado(); };
$g('gNX').onclick = () => { try { localStorage.setItem(NUBE_CFG, JSON.stringify({ off: true })); } catch (e) {} borrarSesion(); setMode(saved.auth ? 'login' : 'alta'); msg('Modo local: datos solo en este navegador.', true); };
function fallo(texto) { G.fails++; sndFail(); G.shake = .5; setGateState('fail'); gPass.value = ''; gPass.focus();
  if (G.fails >= 3) { G.fails = 0; G.lock = Date.now() + 15000; setGateState('locked'); } else { gBtn.disabled = false; msg(texto); } }
async function cloudSubmit(user, pass) {
  if (G.mode === 'nueva') {
    if (pass.length < 6) return msg('La contraseña debe tener al menos 6 caracteres.'); if (pass !== gRep.value) return msg('Las dos contraseñas no coinciden.');
    try { const c = nubeCfg(); const r = await fetch(c.url + '/auth/v1/user', { method: 'PUT', headers: { apikey: c.key, Authorization: 'Bearer ' + nube.recToken, 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pass }) }); if (!r.ok) throw new Error('El enlace ha caducado');
      nube.recToken = null; setMode('login'); msg('✅ Contraseña cambiada. Ya puedes fichar.', true); } catch (e) { msg(e.message); } return;
  }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(user)) return msg('Escribe tu correo electrónico.');
  if (!pass) return msg('Escribe tu contraseña.');
  if (G.mode === 'alta') { if (pass.length < 6) return msg('La contraseña debe tener al menos 6 caracteres.'); if (pass !== gRep.value) return msg('Las dos contraseñas no coinciden.'); }
  setGateState('checking'); gBtn.disabled = true; msg('');
  try {
    let r;
    if (G.mode === 'alta') {
      r = await nfetch('/auth/v1/signup', { method: 'POST', body: JSON.stringify({ email: user, password: pass }) }, false);
      if (!r || !r.access_token) { setGateState('idle'); gBtn.disabled = false; setMode('login'); return msg('Cuenta creada. Abre el enlace de confirmación que te ha llegado al correo y luego ficha.', true); }
    } else r = await nfetch('/auth/v1/token?grant_type=password', { method: 'POST', body: JSON.stringify({ email: user, password: pass }) }, false);
    saveSesion(r);
    const remoto = await nubeLeer();
    if (remoto && remoto.datos) {
      localStorage.setItem(SAVE, JSON.stringify(remoto.datos)); nube.meta.lastSync = Date.parse(remoto.actualizado); saveMeta();
      try { sessionStorage.setItem('torre-fichar', '1'); } catch (e) {} location.reload(); return;
    }
    const nombre = (saved.auth && saved.auth.display) || user.split('@')[0].replace(/^./, x => x.toUpperCase());
    saved.auth = { ...(saved.auth || {}), display: nombre, email: user, cloud: true };
    nube.lista = true; await nubeSubir();
    G.fails = 0; G.name = nombre; msg(`¡Bienvenido, ${nombre}! Tus datos ya están en la nube.`, true); enterTower();
  } catch (e) {
    if (e.status === 400 || e.status === 401 || e.status === 422) { if (/confirm/i.test(e.message)) { setGateState('idle'); gBtn.disabled = false; return msg('Todavía no has confirmado tu correo. Abre el enlace que te ha llegado.'); }
      if (G.mode === 'alta' && /registered|exists/i.test(e.message)) { setGateState('idle'); gBtn.disabled = false; setMode('login'); return msg('Ese correo ya tiene cuenta. Ficha con tu contraseña.'); }
      return fallo(G.mode === 'alta' ? e.message : `Correo o contraseña incorrectos (${G.fails + 1}/3).`); }
    setGateState('idle'); gBtn.disabled = false; msg(e.red ? 'No hay conexión con la nube. Revisa internet o la URL.' : e.message);
  }
}
async function nubeOlvido() {
  const email = gUser.value.trim(); if (!/@/.test(email)) return msg('Escribe tu correo y vuelve a pulsar «¿Has olvidado la contraseña?».');
  try { await nfetch('/auth/v1/recover', { method: 'POST', body: JSON.stringify({ email }) }, false); msg('Te he enviado un enlace para cambiar la contraseña.', true); } catch (e) { msg(e.message); }
}
$g('btnNube').onclick = () => {
  const c = nubeCfg();
  if (!c.url) {
    openModal(`<div class="mtitle px">☁️ CONECTAR A LA NUBE<button class="sbtn x" id="mClose">✕</button></div>
      <div class="note" style="margin-top:12px">Ahora tus datos solo están en este navegador. Pega los datos de tu proyecto de Supabase y después crearás tu cuenta en la pantalla de fichaje.</div>
      <div class="form"><label>URL del proyecto</label><input id="cfU" placeholder="https://xxxx.supabase.co" spellcheck="false"><label>Clave pública (anon / publishable)</label><input id="cfK" placeholder="eyJ… o sb_publishable_…" spellcheck="false">
      <div class="row"><button class="sbtn pri" id="cfOk">Guardar y crear mi cuenta</button></div></div>`);
    byId('cfOk').onclick = () => { const url = byId('cfU').value.trim(), key = byId('cfK').value.trim(); if (!/^https?:\/\//.test(url) || !key) return toast('Pega la URL (https://…) y la clave');
      try { localStorage.setItem(NUBE_CFG, JSON.stringify({ url, key })); } catch (e) {} closeModal(); doLogout();
      setTimeout(() => { setMode('alta'); setGateState('idle'); msg('Nube guardada. Pon tu correo y una contraseña para crear tu cuenta: se subirán tus datos.', true); }, 3200); };
    return;
  }
  openModal(`<div class="mtitle px">☁️ NUBE<button class="sbtn x" id="mClose">✕</button></div>
    <div class="kv" style="margin-top:12px"><span>Cuenta</span><b>${esc(nube.ses ? nube.ses.email : 'sin sesión')}</b></div>
    <div class="kv"><span>Estado</span><b>${{ ok: '✅ sincronizado', sync: '⏳ guardando…', err: '⚠️ ' + esc(nube.error), off: 'sin conexión' }[nube.estado] || '—'}</b></div>
    <div class="kv"><span>Última sincronización</span><b>${nube.meta.lastSync ? fmtD(nube.meta.lastSync) : 'nunca'}</b></div>
    <div class="row"><button class="sbtn pri" id="nS">⬆ Subir ahora</button><button class="sbtn" id="nB">⬇ Traer de la nube</button></div>
    <div class="mm" style="font-style:normal">Los cambios se guardan solos al momento y los demás dispositivos los reciben en unos segundos. Evita cambiar lo mismo en dos dispositivos a la vez.</div>`);
  byId('nS').onclick = async () => { await nubeSubir(); toast(nube.estado === 'ok' ? '☁️ Subido' : '⚠️ ' + nube.error); closeModal(); };
  byId('nB').onclick = async () => { closeModal(); nube.dirty = false; await nubeBajar(true); };
};

let enSesion = false;
try { enSesion = sessionStorage.getItem('torre-sesion') === '1' && !!saved.auth; } catch (e) {}
const fichar = (() => { try { const v = sessionStorage.getItem('torre-fichar'); sessionStorage.removeItem('torre-fichar'); return v; } catch (e) { return null; } })();
const recovery = /type=recovery/.test(location.hash) && new URLSearchParams(location.hash.slice(1));
if (recovery && recovery.get('access_token')) {
  nube.recToken = recovery.get('access_token'); history.replaceState(null, '', location.pathname); showGate('login'); setMode('nueva');
} else if (fichar && nube.ses) {
  nube.lista = true; showGate('login'); G.name = (saved.auth && saved.auth.display) || ''; gBtn.disabled = true;
  msg(`¡Bienvenido${G.name ? ', ' + G.name : ''}! Datos sincronizados con la nube.`, true); enterTower();
} else if (enSesion) { gateEl.classList.add('hidden'); if (nube.ses) { nube.lista = true; nubeEstado(); nubeBajar(); } setTimeout(() => { scheduler(); inicioDelDia(); }, 2500); }
else showGate(nubeCfg().url ? 'login' : (saved.auth ? 'login' : 'alta'));
nubeEstado();
</script>
